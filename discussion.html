<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discussion · Announcement Review</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203333;background:#f5f8f6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#e5f2e8,transparent 60%),#f5f8f6;font-size:15px;line-height:1.6}
a{color:#205b47}.site-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:18px max(24px,calc((100vw - 1160px)/2));background:#fff;border-bottom:1px solid #e3ebe5}
.brand{font:500 25px Georgia,serif;color:#203333;text-decoration:none;white-space:nowrap}.brand span{color:#205b47}.site-links{display:flex;gap:26px}.site-links a{font-size:13px;text-decoration:none;color:#5d7168;white-space:nowrap}.action{justify-self:end;border-radius:9px;background:#205b47;color:white;padding:10px 16px;text-decoration:none;font-size:13px}
main{max-width:940px;margin:0 auto;padding:42px 22px 85px}.back{display:inline-block;margin-bottom:25px;font-size:13px;text-decoration:none}
.card{border:1px solid #e1e9e4;background:#fff;border-radius:16px;box-shadow:0 8px 35px #1b4b3010;padding:clamp(22px,4vw,40px)}
.eyebrow{font-size:11px;letter-spacing:1.8px;color:#327456;font-weight:750;text-transform:uppercase}.tag{display:inline-block;background:#eaf4ed;color:#2b6c50;border-radius:6px;padding:4px 9px;font-size:12px;font-weight:650}
h1{font:500 clamp(27px,4.5vw,42px)/1.18 Georgia,serif;letter-spacing:-.8px;margin:18px 0 23px;overflow-wrap:anywhere}
.meta{display:flex;gap:12px 25px;flex-wrap:wrap;color:#71847b;font-size:13px}.divider{height:1px;background:#e7ede9;margin:28px 0}
.info{background:#f3f8f4;border:1px solid #e0ece3;border-radius:11px;padding:18px 20px}.info h2{font-size:15px;margin:0 0 6px}.info p{margin:0;color:#64796d;font-size:13px}
.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.button{border:1px solid #d8e7dc;border-radius:9px;padding:11px 16px;text-decoration:none;background:#eef7f0;color:#205b47;font-weight:650;font-size:13px}.button.primary{background:#205b47;color:white;border-color:#205b47}
h2{font-size:19px;margin:28px 0 10px}.note{color:#6c8176;font-size:13px}.notes{width:100%;min-height:110px;border:1px solid #dce7df;border-radius:10px;padding:13px;font:inherit;resize:vertical}.save{margin-top:10px;background:#205b47;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}.feedback{font-size:12px;color:#317252;margin-left:10px}
@media(max-width:800px){.site-header{grid-template-columns:1fr auto;padding:15px 18px}.site-links{grid-row:2;grid-column:1/-1;gap:19px;overflow-x:auto}.brand{font-size:22px}.action{grid-column:2;grid-row:1}main{padding-top:25px}}
@media(max-width:420px){.brand{font-size:19px}.action{font-size:12px;padding:8px 10px}.site-links{gap:16px}.site-links a{font-size:12px}}
</style></head>
<body><header class="site-header"><a class="brand" href="./index.html">Announcement <span>Review</span></a><nav class="site-links" aria-label="Main navigation"><a href="./about.html">About</a><a href="./product.html">Product</a><a href="./docs.html">Doc</a><a href="./contact.html">Contact</a></nav><a class="action" href="./index.html">Workspace ↗</a></header>
<main><a class="back" href="./index.html">← Back to market intelligence</a><article class="card" id="discussion"><p>Loading discussion…</p></article></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const root=document.querySelector('#discussion');
(async()=>{try{const id=new URLSearchParams(location.search).get('item');if(!new URLSearchParams(location.search).has('url')&&!/^\d{1,4}$/.test(id||''))throw Error('Invalid discussion reference');const response=await fetch('./data/market-feed.json',{cache:'no-store'});if(!response.ok)throw Error('Discussion feed unavailable');const data=await response.json();const items=Array.isArray(data.items)?data.items.filter(i=>['ASX','AFR','Reddit','News','Glassdoor'].includes(i.source)&&/^https:\/\//.test(i.url)&&i.title&&i.published):[];const requestedUrl=new URLSearchParams(location.search).get('url');const item=requestedUrl?items.find(i=>i.url===requestedUrl):items[Number(id)];if(!item||!['Reddit','Glassdoor'].includes(item.source))throw Error('Discussion not found in the current feed');const date=new Date(item.published).toLocaleString('en-AU',{dateStyle:'full',timeStyle:'short'});root.innerHTML='<div class="eyebrow">Community intelligence <span class="tag">Discussion</span></div><h1>'+esc(item.title)+'</h1><div class="meta"><span>Published '+esc(date)+'</span><span>Source: '+esc(item.source)+'</span><span>Indexed via '+esc(item.via||'public feed')+'</span></div><div class="divider"></div><div class="info"><h2>About this discussion</h2><p>This is a link to a public forum discussion. The original post, replies, votes and author information are not reproduced here. Community opinions are unverified; open the original thread to read the context.</p></div><div class="buttons"><a class="button primary" id="original" target="_blank" rel="noopener noreferrer">Open original discussion ↗</a><a class="button" href="./index.html">Browse more discussions</a></div><h2>Research notes</h2><p class="note">Private notes are stored only in this browser. They are not posted to the original forum or shared with other users.</p><textarea class="notes" id="notes" placeholder="Record key claims, questions, or evidence to investigate…"></textarea><div><button class="save" id="save">Save notes</button><span class="feedback" id="feedback" aria-live="polite"></span></div>';document.querySelector('#original').href=item.url;const key='ar_discussion_notes_'+encodeURIComponent(item.url);try{document.querySelector('#notes').value=localStorage.getItem(key)||'';}catch(e){}document.querySelector('#save').onclick=()=>{try{localStorage.setItem(key,document.querySelector('#notes').value);document.querySelector('#feedback').textContent='Saved on this device';}catch(e){document.querySelector('#feedback').textContent='Unable to save in this browser';}};}catch(e){root.innerHTML='<div class="eyebrow">Discussion</div><h1>Discussion unavailable</h1><p>'+esc(e.message)+'</p><p><a href="./index.html">Return to market intelligence</a></p>';}})();
</script></body></html>
