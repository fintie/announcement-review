<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article details · Announcement Review</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#182d30;font:15px/1.7 system-ui,sans-serif}a{color:#196252}main{max-width:850px;margin:auto;padding:42px 24px 90px}.panel{background:white;border:1px solid #dce4e2;border-radius:12px;padding:32px}h1{font:normal 36px/1.22 Georgia,serif;margin:15px 0 24px;overflow-wrap:anywhere}.muted{color:#637773}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#607672}.button{display:inline-block;background:#196252;color:white;text-decoration:none;padding:11px 18px;border-radius:8px;margin-top:16px}.meta{display:flex;flex-wrap:wrap;gap:15px;color:#637773;font-size:13px}.note{padding:14px;background:#f1f5f2;border-radius:8px;margin-top:26px}/* Unified site-wide navigation */
.site-header{display:grid!important;grid-template-columns:minmax(170px,1fr) auto minmax(130px,1fr);align-items:center;gap:20px;padding:18px max(24px,calc((100vw - 1160px)/2))!important;min-height:78px;background:#fff;border-bottom:1px solid #dce4e2;box-sizing:border-box}

.site-header .site-brand span{color:#196252}
.site-header .site-links{display:flex!important;align-items:center;justify-content:center;flex-wrap:nowrap;gap:27px;margin:0!important;padding:0!important;border:0!important;white-space:nowrap}
.site-header .site-links a{font:500 14px/1.5 system-ui,sans-serif!important;text-decoration:none!important;color:#48615a!important;padding:8px 0;border-bottom:2px solid transparent}
.site-header .site-links a:hover,.site-header .site-links a[aria-current=page]{color:#196252!important;border-bottom-color:#196252}
.site-header .site-action{justify-self:end;font:500 13px/1.5 system-ui,sans-serif!important;white-space:nowrap;color:#196252;text-decoration:none;border:1px solid #dce4e2;border-radius:8px;padding:9px 13px;background:#fff}
.site-header button.site-action{cursor:pointer}
@media(max-width:860px){.site-header{grid-template-columns:1fr auto;gap:12px!important;padding:15px 20px!important}.site-header .site-brand{font-size:18px!important}.site-header .site-links{grid-row:2;grid-column:1/-1;justify-content:flex-start;gap:23px;overflow-x:auto;width:100%;padding-top:3px!important}.site-header .site-action{grid-column:2;grid-row:1}}
@media(max-width:420px){.site-header{padding:13px 16px!important}.site-header .site-brand{font-size:16px!important}.site-header .site-links{gap:19px}.site-header .site-links a{font-size:13px!important}.site-header .site-action{padding:7px 9px;font-size:12px!important}}

.role-nav{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 32px;border:0}.role-nav a{display:inline-block;text-decoration:none;border:1px solid #d4e1d8;background:#fff;padding:9px 14px;border-radius:22px;font-size:14px}.role-nav a:hover{background:#e8f2ec}.role-card{scroll-margin-top:20px;display:flex;flex-direction:column}.role-card h2{margin-top:12px}.role-card h3{font-size:15px;margin:18px 0 4px}.role-card ul,.role-card ol{padding-left:22px}.role-card li{margin:7px 0}.role-icon{display:inline-flex;align-items:center;justify-content:center;background:#e8f2ec;color:#196252;border-radius:11px;font-size:13px;font-weight:700;width:40px;height:40px}.role-note{background:#f2f6f2;padding:12px 14px;border-left:3px solid #7eab92;font-size:14px;color:#526b60;margin-top:auto}.role-cta{display:inline-block;align-self:flex-start;text-decoration:none;background:#196252;color:white;border-radius:8px;padding:10px 16px;margin-top:12px;font-size:14px}.process{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.process>div{background:#f3f7f4;padding:16px;border-radius:10px}.process p{font-size:14px;margin:6px 0}@media(max-width:700px){.process{grid-template-columns:1fr 1fr}.role-nav{gap:8px}.role-nav a{font-size:13px;padding:8px 11px}}@media(max-width:420px){.process{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><a class="site-brand" href="./index.html">Announcement <span>Review</span></a><nav class="site-links" aria-label="Main navigation"><a href="./about.html">About</a><a href="./product.html">Product</a><a href="./docs.html">Doc</a><a href="./contact.html">Contact</a></nav><a class="site-action" href="./index.html">Workspace ↗</a></header><main><p><a href="./index.html">← Back to latest updates</a></p><article class="panel" id="story"><p class="muted">Loading item…</p></article></main><script>
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const root=document.querySelector('#story');try{const raw=new URLSearchParams(location.search).get('item');if(!/^\\d{1,4}$/.test(raw||''))throw Error('Invalid item identifier');const response=await fetch('./data/market-feed.json',{cache:'no-store'});if(!response.ok)throw Error('Feed unavailable');const data=await response.json();const items=Array.isArray(data.items)?data.items.filter(i=>['ASX','AFR','Reddit','News','Glassdoor'].includes(i.source)&&/^https:\/\//.test(i.url)&&i.title&&i.published):[];const requestedUrl=new URLSearchParams(location.search).get('url');const item=requestedUrl?items.find(i=>i.url===requestedUrl):items[Number(raw)];if(!item)throw Error('This item is no longer in the latest feed');const category=item.source==='Reddit'?'Discussion':'News';const date=new Date(item.published).toLocaleString('en-AU',{dateStyle:'full',timeStyle:'short'});root.innerHTML='<div class="eyebrow">'+category+'</div><h1>'+escapeHtml(item.title)+'</h1><div class="meta"><span>Published: '+escapeHtml(date)+'</span><span>Source: <strong>'+escapeHtml(item.source)+'</strong></span><span>Indexed via: '+escapeHtml(item.via||'public feed')+'</span></div><div class="note">This page is an index entry, not a reproduction of the article or forum post. The source has not been independently verified. Read the original content and context before relying on it.</div><a class="button" id="originalLink" target="_blank" rel="noopener noreferrer">Read original source ↗</a>';document.querySelector('#originalLink').href=item.url;}catch(e){root.innerHTML='<h1>Item unavailable</h1><p class="muted">'+escapeHtml(e.message)+'</p><p><a href="./index.html">Return to the homepage</a></p>';}})();
</script></body></html>
